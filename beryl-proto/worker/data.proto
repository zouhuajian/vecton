syntax = "proto3";

package worker;

import "common/common.proto";
import "worker/block_meta.proto";
import "worker/data_header.proto";

// ============================================================================
// Worker Data Service: block-local stream and sync API
// ============================================================================
//
// Block is the current storage, routing, and reporting unit. StorageChunk is a
// worker-local IO granularity used inside block operations.
// TransportFrame is represented by the stream request/response payloads below.
// StorageChunk and TransportFrame are intentionally not encoded as the same
// message.

message ReadBlockRequestProto {
  // Low-frequency data-plane control header.
  // High-frequency ReadBlock chunks must not carry this header.
  worker.DataRequestHeaderProto header = 1;

  // Target block. Worker data-plane APIs are block-local and must not parse
  // file-level offsets or layouts.
  common.BlockIdProto block_id = 2;

  // Block-local byte range to read. The offset is relative to block_id,
  // not relative to the file.
  common.ByteRangeProto byte_range = 3;

  // Client-preferred transport frame payload size in bytes.
  // The worker may clamp it to its configured maximum.
  // This is not the worker-local StorageChunk size.
  uint32 frame_size = 4;

  // Metadata-confirmed worker process-run identity for the selected endpoint.
  string worker_run_id = 5;

  // Metadata-issued expected block layout facts from the authoritative FileLayout.
  uint32 block_format_id = 6;
  uint64 block_size = 7;
  uint32 chunk_size = 8;
  uint64 effective_len = 9;

  // Stable metadata group name for the local block-store lookup.
  string group_name = 10;
}

// One ordered payload from a ReadBlock response stream. Normal stream
// completion is the only end-of-stream marker; the client validates the exact
// requested byte count.
message ReadBlockChunkProto {
  bytes data = 1;
}

// First request payload for one block-local write RPC. Metadata-issued block
// facts appear once; subsequent payloads contain only ordered data bytes.
message WriteBlockCommandProto {
  worker.DataRequestHeaderProto header = 1;
  string group_name = 2;
  common.BlockIdProto block_id = 3;
  string worker_run_id = 4;
  uint32 block_format_id = 5;
  uint64 block_size = 6;
  uint32 chunk_size = 7;
  common.FencingTokenProto fencing_token = 8;
  uint64 write_offset = 9;
  common.TierProto tier = 10;
}

// One ordered request payload. The first payload must be command and every
// later payload must be nonempty data. The RPC does not support replay,
// random-offset writes, or multiple blocks.
message WriteBlockRequestProto {
  oneof payload {
    WriteBlockCommandProto command = 1;
    bytes data = 2;
  }
}

// Sent exactly once after validation and block-open checkpoint. Normal response
// stream completion means the stream prefix was durably checkpointed.
message WriteBlockResponseProto {
}

service WorkerDataService {
  rpc ReadBlock(ReadBlockRequestProto)
      returns (stream ReadBlockChunkProto);

  rpc WriteBlock(stream WriteBlockRequestProto)
      returns (stream WriteBlockResponseProto);
}
