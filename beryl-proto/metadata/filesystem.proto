syntax = "proto3";

package metadata;

import "common/common.proto";
import "common/header.proto";

// ============================================================================
// FileSystemServiceProto
// ============================================================================
//
// FileSystemServiceProto is the external metadata/control-plane API.
//
// Error contract:
// - Recoverable business, protocol, and consistency failures return gRPC OK.
// - ResponseHeaderProto.error carries the RPC error envelope.
// - Non-OK gRPC status is reserved for transport, auth, and framework failures.
//
// Authority contract:
// - Path is an adapter entrypoint.
// - inode, block, lease, fencing, and epoch identities carry the
//   consistency contract.
// - WriteSession is an internal implementation concept and is not a public RPC
//   name or message name.

// ============================================================================
// Shared external payloads
// ============================================================================

/// Payload-free namespace type tag.
enum FileTypeProto {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIR = 2;
}

/// Directory entry metadata visible through listing APIs.
message DirEntryProto {
  /// Entry name (UTF-8).
  string name = 1;
  /// Required inode kind for the child status.
  FileTypeProto kind = 2;
  uint64 len = 3;
  // Milliseconds since Unix epoch.
  uint64 create_time = 4;
  uint64 modify_time = 5;
}

// Identifies a file write lease. Both fields must be non-zero; Metadata checks
// caller ownership and current authority independently of this structural value.
message WriteHandleProto {
  uint64 inode_id = 1;
  uint64 write_lease_epoch = 2;
}

// Metadata-issued block identity, write locations, layout, and fencing authority.
// Locations are selected destinations, not evidence that data exists or is readable.
message LocatedBlockProto {
  common.BlockIdProto block_id = 1;
  // Start of this block in the file; new-block IO starts at block-local offset zero.
  uint64 file_offset = 2;
  // Metadata-selected Beryl block data/meta interpretation format for this target.
  // Worker-local execution backend selection is not encoded here.
  uint32 block_format_id = 3;
  // Maximum writable capacity from the persisted FileLayout. Workers reserve
  // and enforce this bound before the final effective length is known.
  uint64 block_size = 4;
  // Metadata-selected chunk size for the worker-local block format.
  uint32 chunk_size = 5;
  uint64 write_offset = 6;
  repeated common.WorkerEndpointInfoProto worker_endpoints = 7;
  common.FencingTokenProto fencing_token = 8;
  // Worker-local storage tier requested for this block replica.
  common.TierProto tier = 9;
}

message CommittedBlockProto {
  common.BlockIdProto block_id = 1;
  // Total block length, including the previously visible tail prefix.
  uint64 len = 2;
}

message FileBlockLocationProto {
  common.BlockIdProto block_id = 1;
  uint64 file_offset = 2;
  uint64 len = 3;
  // Metadata-issued read candidates. Empty means FileLayout has this block
  // range but no live reported replica is currently eligible.
  repeated common.WorkerEndpointInfoProto workers = 4;
  // FileLayout-derived block format facts that workers validate before reads.
  uint32 block_format_id = 5;
  uint64 block_size = 6;
  uint32 chunk_size = 7;
  // Block-local readable prefix expected by metadata for this block.
  uint64 effective_len = 8;
}

// ============================================================================
// Namespace
// ============================================================================

message GetStatusRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
}

message GetStatusResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 len = 2;
  // Milliseconds since Unix epoch.
  uint64 create_time = 3;
  uint64 modify_time = 4;
  // Required namespace kind. UNSPECIFIED is not a successful domain value.
  FileTypeProto kind = 5;
}

message ListStatusRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
  // Opaque seek key returned as next_cursor by a preceding page for this same
  // directory. The server retains no iterator or snapshot between requests;
  // entries inserted at or before the cursor may be omitted, while entries
  // inserted after it may appear in later pages.
  bytes cursor = 3;
  // Maximum entries in this page. Zero selects the Metadata server default;
  // a non-zero value above the server maximum is rejected.
  uint32 limit = 4;
}

message ListStatusResponseProto {
  common.ResponseHeaderProto header = 1;
  repeated DirEntryProto entries = 2;
  // On success, an opaque continuation key present exactly when eof is false.
  bytes next_cursor = 3;
  // True when this page reached the current end of the directory scan. A
  // successful EOF response has an empty next_cursor.
  bool eof = 4;
}

message CreateDirectoryRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
  bool recursive = 3;
}

message CreateDirectoryResponseProto {
  common.ResponseHeaderProto header = 1;
  // Milliseconds since Unix epoch.
  uint64 create_time = 2;
  uint64 modify_time = 3;
}

message DeleteOptionsProto {
  bool recursive = 1;
}

message DeleteRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
  DeleteOptionsProto options = 3;
}

message DeleteResponseProto {
  common.ResponseHeaderProto header = 1;
}

message RenameRequestProto {
  common.RequestHeaderProto header = 1;
  string src_path = 2;
  string dst_path = 3;
  uint32 flags = 4;
}

message RenameResponseProto {
  common.ResponseHeaderProto header = 1;
}

// ============================================================================
// Read
// ============================================================================

message OpenFileRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
}

message OpenFileResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 inode_id = 2;
  uint64 file_size = 3;
  // Content change counter scoped to this inode; it does not retain history.
  // It advances when the Metadata-visible file contents change.
  optional uint64 generation = 4;
}

message GetBlockLocationsRequestProto {
  common.RequestHeaderProto header = 1;
  oneof target {
    string path = 2;
    uint64 inode_id = 3;
  }
  optional common.ByteRangeProto range = 4;
}

message GetBlockLocationsResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 inode_id = 2;
  uint64 file_size = 3;
  repeated FileBlockLocationProto locations = 4;
  // Same generation contract as OpenFileResponseProto.generation.
  optional uint64 generation = 5;
}

// ============================================================================
// Write
// ============================================================================

message CreateFileRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
}

message CreateFileResponseProto {
  common.ResponseHeaderProto header = 1;
  // Metadata-stored FileLayout selected by the durable namespace mutation.
  common.FileLayoutProto layout = 2;
  WriteHandleProto write_handle = 3;
  uint64 expires_at_ms = 4;
  // Durable content generation used as the first publish CAS precondition.
  uint64 generation = 5;
}

enum OpenWriteModeProto {
  OPEN_WRITE_MODE_UNSPECIFIED = 0;
  OPEN_WRITE_MODE_WRITE = 1;
  OPEN_WRITE_MODE_APPEND = 2;
}

message OpenWriteRequestProto {
  common.RequestHeaderProto header = 1;
  string path = 2;
  OpenWriteModeProto mode = 3;
}

message OpenWriteResponseProto {
  common.ResponseHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
  uint64 base_size = 3;
  uint64 expires_at_ms = 4;
  // Metadata-stored FileLayout for the existing file.
  common.FileLayoutProto layout = 5;
  // Durable content generation used as the publish CAS precondition.
  uint64 generation = 6;
  // Existing partial tail, authorized for this newly acquired writer.
  LocatedBlockProto tail_block = 7;
}

message AllocateBlockRequestProto {
  common.RequestHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
  // Absent for the first allocation in this write session, including append.
  // Otherwise identifies the preceding allocation in the active session chain.
  // An existing successor is replayed unchanged while its record remains valid.
  // SyncWrite may retire an unpublished suffix, allowing its predecessor to
  // identify a new allocation. This is not cross-session historical deduplication.
  optional common.BlockIdProto previous_block_id = 3;
}

message AllocateBlockResponseProto {
  common.ResponseHeaderProto header = 1;
  // Required on success. Allocation alone neither writes nor publishes file data.
  LocatedBlockProto block = 2;
}

// Final publication and lease end are one transaction. Replay must preserve the
// client/call identity and all business fields; content equality alone is insufficient.
message CommitFileRequestProto {
  common.RequestHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
  repeated CommittedBlockProto committed_blocks = 3;
  uint64 final_size = 4;
  uint64 expected_generation = 5;
  OpenWriteModeProto write_mode = 6;
  uint64 expected_file_size = 7;
}

// Success confirms publication, lease revocation, and durable completion evidence.
// A later content change or close can retire the bounded replay evidence.
message CommitFileResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 committed_size = 2;
}

message AbortFileWriteRequestProto {
  common.RequestHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
}

message AbortFileWriteResponseProto {
  common.ResponseHeaderProto header = 1;
}

message RenewLeaseRequestProto {
  common.RequestHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
}

message RenewLeaseResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 expires_at_ms = 2;
}

message SyncWriteRequestProto {
  common.RequestHeaderProto header = 1;
  WriteHandleProto write_handle = 2;
  repeated CommittedBlockProto committed_blocks = 3;
  uint64 target_size = 4;
  uint64 expected_generation = 5;
  OpenWriteModeProto write_mode = 6;
  uint64 expected_file_size = 7;
}

message SyncWriteResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 synced_size = 2;
  optional uint64 generation = 3;
}

// ============================================================================
// Metadata state freshness
// ============================================================================

message MsyncRequestProto {
  common.RequestHeaderProto header = 1;
}

message MsyncResponseProto {
  common.ResponseHeaderProto header = 1;
  common.GroupStateWatermarkProto state = 2;
}

// A Worker checks current write authority once before each data stream.
message AuthorizeBlockWriteRequestProto {
  common.RequestHeaderProto header = 1;
  string group_name = 2;
  uint64 worker_id = 3;
  string worker_run_id = 4;
  common.FencingTokenProto fencing_token = 5;
  uint64 write_offset = 6;
  uint64 block_size = 7;
  uint32 block_format_id = 8;
  uint32 chunk_size = 9;
  common.TierProto tier = 10;
}
message AuthorizeBlockWriteResponseProto {
  common.ResponseHeaderProto header = 1;
  uint64 visible_len = 2;
}

service FileSystemServiceProto {
  rpc AuthorizeBlockWrite(AuthorizeBlockWriteRequestProto) returns (AuthorizeBlockWriteResponseProto);
  // namespace
  rpc GetStatus(GetStatusRequestProto) returns (GetStatusResponseProto);
  rpc ListStatus(ListStatusRequestProto) returns (ListStatusResponseProto);
  rpc CreateDirectory(CreateDirectoryRequestProto) returns (CreateDirectoryResponseProto);
  rpc Delete(DeleteRequestProto) returns (DeleteResponseProto);
  rpc Rename(RenameRequestProto) returns (RenameResponseProto);

  // read
  rpc OpenFile(OpenFileRequestProto) returns (OpenFileResponseProto);
  rpc GetBlockLocations(GetBlockLocationsRequestProto) returns (GetBlockLocationsResponseProto);

  // write
  rpc CreateFile(CreateFileRequestProto) returns (CreateFileResponseProto);
  rpc OpenWrite(OpenWriteRequestProto) returns (OpenWriteResponseProto);
  // Allocate a new block, or replay its still-valid predecessor-addressed result.
  rpc AllocateBlock(AllocateBlockRequestProto) returns (AllocateBlockResponseProto);
  rpc CommitFile(CommitFileRequestProto) returns (CommitFileResponseProto);
  rpc AbortFileWrite(AbortFileWriteRequestProto) returns (AbortFileWriteResponseProto);
  rpc RenewLease(RenewLeaseRequestProto) returns (RenewLeaseResponseProto);

  // SyncWrite keeps the write handle/session open.
  // CommitFile remains the final close operation.
  rpc SyncWrite(SyncWriteRequestProto) returns (SyncWriteResponseProto);

  // freshness
  rpc Msync(MsyncRequestProto) returns (MsyncResponseProto);
}
