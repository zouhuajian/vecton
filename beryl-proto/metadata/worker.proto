syntax = "proto3";

package metadata;

import "common/common.proto";
import "common/header.proto";

// ============================================================================
// Worker → Metadata RPC: Registration & Heartbeat
// ============================================================================

message RegisterWorkerRequestProto {
  common.RequestHeaderProto header = 1;
  /// Stable logical worker identity supplied by the worker.
  uint64 worker_id = 2;
  /// UUID generated once for this worker process start; not an epoch.
  string worker_run_id = 3;
  /// Routable worker data endpoint advertised to metadata and clients.
  common.EndpointProto advertised_endpoint = 4;
}

message RegisterWorkerResponseProto {
  common.ResponseHeaderProto header = 1;
  /// Confirmed stable worker identity.
  uint64 worker_id = 2;
  /// Accepted process-run identity for this group.
  string accepted_worker_run_id = 3;
}

message HeartbeatRequestProto {
  common.RequestHeaderProto header = 1;
  uint64 worker_id = 2;
  /// UUID accepted by RegisterWorker for this worker process run.
  string worker_run_id = 3;
  /// Monotonic sequence number scoped to (group_name, worker_run_id).
  uint64 heartbeat_seq = 4;
  /// Current advertised data endpoint; must match the registered descriptor.
  common.EndpointProto advertised_endpoint = 5;
  /// Capacity information.
  CapacityInfoProto capacity = 6;
  /// Load information.
  LoadInfoProto load = 7;
  /// Health status.
  HealthStatusProto health = 8;
}

message CapacityInfoProto {
  /// Total capacity in bytes.
  uint64 total_bytes = 1;
  /// Used capacity in bytes.
  uint64 used_bytes = 2;
  /// Available capacity in bytes.
  uint64 available_bytes = 3;
  /// Largest writable free bytes currently available for one new block on each tier.
  repeated TierFreeProto tier_free = 4;
}

message TierFreeProto {
  common.TierProto tier = 1;
  uint64 free_bytes = 2;
}

message LoadInfoProto {
  /// Number of active read operations.
  uint32 active_reads = 1;
  /// Number of active write operations.
  uint32 active_writes = 2;
}

enum HealthStatusProto {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

message HeartbeatResponseProto {
  common.ResponseHeaderProto header = 1;
  /// Confirmed stable worker identity.
  uint64 worker_id = 2;
  /// Accepted live worker process-run identity.
  string accepted_worker_run_id = 3;
  /// Local liveness timeout used by metadata for this worker run.
  uint32 liveness_timeout_ms = 4;
  /// Bounded, retryable cleanup commands for this accepted worker run.
  repeated BlockCleanupCommandProto cleanup_commands = 5;
}

/// Requests deletion of one exact worker-local Ready block.
message BlockCleanupCommandProto {
  common.BlockIdProto block_id = 1;
}

// ============================================================================
// Worker → Metadata RPC: Block Reporting
// ============================================================================

/// Worker-observed state of one local block.
enum ReportedBlockStateProto {
  REPORTED_BLOCK_STATE_UNSPECIFIED = 0;
  REPORTED_BLOCK_STATE_READY = 1;
  REPORTED_BLOCK_STATE_CORRUPT = 2;
  REPORTED_BLOCK_STATE_DELETING = 3;
}

/// Current worker-local state for one block. Chunk bitmaps and range routing are out of scope.
message ReportedBlockProto {
  common.BlockIdProto block_id = 1;
  // Persisted writer epoch that owns this durable checkpoint.
  uint64 lease_epoch = 2;
  common.TierProto tier = 3;
  ReportedBlockStateProto state = 4;
  // Worker-persisted valid length for this exact local block version.
  // Zero is a recoverable empty checkpoint or a transient Deleting observation.
  uint64 effective_len = 5;
}

/// One block entry in a Delta Block Report.
/// Present carries the current local state; absent means no reportable local record remains.
message DeltaBlockReportEntryProto {
  oneof block {
    ReportedBlockProto present = 1;
    common.BlockIdProto absent = 2;
  }
}

message FullBlockReportBatchProto {
  /// Sequence number within the current baseline_seq.
  uint64 batch_seq = 1;
  /// True when this is the final batch of the current baseline_seq.
  bool final_batch = 2;
  repeated ReportedBlockProto blocks = 3;
}

/// One ordered Delta batch for a published Full Report baseline.
message DeltaBlockReportBatchProto {
  /// Ordered batch sequence scoped to the current baseline_seq.
  uint64 batch_seq = 1;
  repeated DeltaBlockReportEntryProto entries = 2;
}

message BlockReportRequestProto {
  common.RequestHeaderProto header = 1;
  /// Stable logical worker identity.
  uint64 worker_id = 2;
  /// Current live worker process-run identity.
  string worker_run_id = 3;
  /// Monotonic full-report baseline sequence within one worker run and group.
  uint64 baseline_seq = 4;
  oneof batch {
    FullBlockReportBatchProto full_report = 5;
    DeltaBlockReportBatchProto delta_report = 6;
  }
}

/// Batch kind confirmed by a successful BlockReport response.
enum BlockReportKindProto {
  BLOCK_REPORT_KIND_UNSPECIFIED = 0;
  BLOCK_REPORT_KIND_FULL = 1;
  BLOCK_REPORT_KIND_DELTA = 2;
}

/// Cumulative Metadata progress after processing one report batch.
message BlockReportResponseProto {
  common.ResponseHeaderProto header = 1;
  /// Must match the request batch; errors may leave this unspecified.
  BlockReportKindProto report_kind = 2;
  uint64 baseline_seq = 3;
  /// Next batch expected while Full staging is incomplete or after an accepted Delta.
  /// Zero when the Full baseline is already published and no next Full batch is expected.
  uint64 next_batch_seq = 4;
  /// False only while a Full Report baseline remains incomplete.
  /// Successful Delta responses must always return true.
  bool baseline_published = 5;
}

// ============================================================================
// Metadata Worker Service
// ============================================================================

service MetadataWorkerServiceProto {
  /// Register a worker with metadata service.
  rpc RegisterWorker(RegisterWorkerRequestProto) returns (RegisterWorkerResponseProto);
  
  /// Periodic heartbeat from worker to metadata.
  rpc Heartbeat(HeartbeatRequestProto) returns (HeartbeatResponseProto);
  
  /// Block report: worker reports block-level entries it holds.
  rpc BlockReport(BlockReportRequestProto) returns (BlockReportResponseProto);
}
